name: Daily reel

# Daily at ~18:05 IST a Claude scheduled task triggers this workflow (scheduled=true); GitHub's own cron below is only
# a backup because it often starts hours late. The "plan" step posts at most one reel per day, only 17:00-23:30 IST.
on:
  # schedule paused on request (19 Nov 2026): reels are made only when Asit asks. To resume, restore:
  # schedule:
  #   - cron: "45 12 * * *"
  #   - cron: "40 13 * * *"
  #   - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Deliver: send the finished reel + caption to Telegram and log it (posts to Instagram only if POST_MODE=auto)"
        type: boolean
        default: true
      slug:
        description: "Existing episode to use (e.g. ep01-tatkal-crash). Leave empty to let Claude write a new one."
        required: false
        default: ""
      series:
        description: "Which series to pick or write when no episode is given"
        type: choice
        options: [system-design, dsa]
        default: system-design
      scheduled:
        description: "Behave like the daily schedule (skip if already posted today or outside 17:00-23:30 IST)"
        type: boolean
        default: false
      unattended:
        description: "No fresh Instagram review available: use the last saved one"
        type: boolean
        default: false
  # used by dsa-schedule.yml
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
      slug:
        type: string
        default: ""
      series:
        type: string
        default: system-design
      scheduled:
        type: boolean
        default: false
      unattended:
        type: boolean
        default: false

concurrency: daily-reel

env:
  SERIES: ${{ inputs.series || 'system-design' }}
  UNATTENDED: ${{ inputs.unattended && '1' || '' }}

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      slug: ${{ steps.ep.outputs.slug }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # the tip of the branch, not the commit that started the run: a caller may have just pushed the episode
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (prebuilt, avoids slow apt mirrors)
        uses: AnimMouse/setup-ffmpeg@v1
        continue-on-error: true
      - name: Install
        timeout-minutes: 12
        run: |
          command -v ffprobe >/dev/null || (timeout 420 sudo apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
          pip install -r requirements.txt
          npm ci

      - name: Plan today's run
        id: plan
        run: |
          # skip scheduled runs if a reel already went out today (IST)
          POSTED=$(node -e "const p=require('./data/published.json');const d=new Date(Date.now()+19800000).toISOString().slice(0,10);console.log(p.some(x=>x.kind==='reel'&&new Date(new Date(x.postedAt).getTime()+19800000).toISOString().slice(0,10)===d)?'yes':'no')")
          # an episode that was written but never posted is used before writing a new one
          PENDING=$(node -e "const fs=require('fs');const p=require('./data/published.json').map(x=>x.slug);const eps=fs.readdirSync('episodes',{withFileTypes:true}).filter(d=>d.isDirectory()&&fs.existsSync('episodes/'+d.name+'/episode.json')).map(d=>[d.name,require('./episodes/'+d.name+'/episode.json').number]).sort((a,b)=>a[1]-b[1]);const dsa=process.env.SERIES==='dsa';const n=eps.filter(e=>!p.includes(e[0])&&e[0].startsWith('dsa')===dsa);console.log(n.length?n[0][0]:'')")
          SLUG="${{ inputs.slug }}"
          [ -z "$SLUG" ] && SLUG="$PENDING"
          NOW=$(TZ=Asia/Kolkata date +%H%M)
          SKIP=no
          if [ "${{ inputs.scheduled }}" = "true" ]; then
            [ "$POSTED" = "yes" ] && SKIP=yes
            # GitHub can start scheduled runs hours late; never post outside the evening slot
            { [ "$NOW" -lt 1700 ] || [ "$NOW" -gt 2330 ]; } && SKIP=yes
          fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "IST $NOW · posted today: $POSTED · episode: ${SLUG:-new one from Claude} · skip: $SKIP"

      - name: Clean the Claude token
        id: tok
        if: steps.plan.outputs.skip != 'yes'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # a token pasted from a terminal can carry line breaks or spaces; strip them
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "token=$CLEAN" >> $GITHUB_OUTPUT

      - name: Last reel reviewed?
        if: steps.plan.outputs.skip != 'yes' && steps.plan.outputs.slug == ''
        run: node pipeline/review-gate.mjs

      - name: Claude writes the episode
        if: steps.plan.outputs.skip != 'yes' && steps.plan.outputs.slug == ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.token }}
          prompt: |
            First read data/reviews.json: apply one fix from the latest review and set "learnedFrom".
            Series for this run: ${{ env.SERIES }}. If it is "dsa", read .claude/skills/make-episode/dsa.md and follow it
            instead of the steps below (it covers episode.json AND notes.json). Otherwise:
            Write the next Debug Bro reel episode. Read .claude/skills/make-episode/SKILL.md, formats.md next to it, and data/swipe.md, then follow every step:
            pick the topic (data/topics.md "Promised next" first), research the facts with WebSearch/WebFetch, write
            episodes/<slug>/episode.json, tick the topic in data/topics.md, and run `node pipeline/validate.mjs <slug>`
            until it prints OK. Do not edit src/ or pipeline/. Do not commit; the workflow commits for you.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node pipeline/validate.mjs:*),Bash(ls:*),Bash(cat:*)"

      - name: Why did Claude fail?
        if: failure()
        run: |
          F=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$F" ] && node -e "const o=JSON.parse(require('fs').readFileSync('$F','utf8'));const a=Array.isArray(o)?o:[o];for(const m of a){if(m.type==='result'){console.log('result:',(m.result||'').slice(0,800));}if(m.type==='assistant'){const t=(m.message?.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(' ');if(t)console.log('assistant:',t.slice(0,400));}}" || echo "no execution output"

      - name: Save the episode
        if: steps.plan.outputs.skip != 'yes' && steps.plan.outputs.slug == ''
        run: |
          git config user.name "debug-bro-bot"
          git config user.email "debug-bro-bot@users.noreply.github.com"
          git add episodes data
          git diff --cached --quiet || git commit -m "episode: $(ls -t episodes | head -1)"
          git pull --rebase -q && git push

      - name: Pick the episode
        id: ep
        if: steps.plan.outputs.skip != 'yes'
        run: |
          SLUG="${{ steps.plan.outputs.slug }}"
          [ -z "$SLUG" ] && SLUG=$(node -e "const fs=require('fs');const p=require('./data/published.json').map(x=>x.slug);const eps=fs.readdirSync('episodes',{withFileTypes:true}).filter(d=>d.isDirectory()&&fs.existsSync('episodes/'+d.name+'/episode.json')).map(d=>[d.name,require('./episodes/'+d.name+'/episode.json').number]).sort((a,b)=>a[1]-b[1]);const dsa=process.env.SERIES==='dsa';const n=eps.filter(e=>!p.includes(e[0])&&e[0].startsWith('dsa')===dsa);console.log(n.length?n[0][0]:'')")
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "episode: $SLUG"

      - name: Render review frames
        if: steps.plan.outputs.skip != 'yes' && steps.ep.outputs.slug != ''
        run: node pipeline/review-stills.mjs "${{ steps.ep.outputs.slug }}"

      - name: Claude reviews the frames
        if: steps.plan.outputs.skip != 'yes' && steps.ep.outputs.slug != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.token }}
          prompt: |
            You are the art director for the Debug Bro reel "${{ steps.ep.outputs.slug }}".
            1. Read brand.md (especially "Frame review checklist") and episodes/${{ steps.ep.outputs.slug }}/episode.json.
            2. Look at every image out/${{ steps.ep.outputs.slug }}/review-*.jpg (review-01 is the first frame people see: it must show the hook clearly, never a blank or half-faded frame).
            3. For each frame, check the checklist. If a frame fails, fix it by editing ONLY text fields in episode.json
               (cap, vo, line, question, setup, error, labels, items, title, sub, desc, example, headline, place, stamp, code, rule, cta, tease, react, pose). Keep every fact and its
               status exactly as sourced. Then run `node pipeline/validate.mjs ${{ steps.ep.outputs.slug }}` until OK.
            4. Write out/${{ steps.ep.outputs.slug }}/review.md: one line per frame (PASS or FIXED: what), then one line
               "Hook strength: x/10 because ...".
            DSA-101 episodes (slug starts with "dsa"): the checklist's DSA section applies instead of the stage-style items.
            All on-screen text is in each scene's "data" (fields: .claude/skills/make-episode/dsa.md) and you may edit those
            text fields, but never change code lines, numbers, quiz answers or notes.json. Report a wrong one in review.md.
            Do not edit src/, pipeline/ or any other file. Do not commit.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Bash(node pipeline/validate.mjs:*),Bash(ls:*)"

      - name: Save review fixes
        if: steps.plan.outputs.skip != 'yes' && steps.ep.outputs.slug != ''
        run: |
          git config user.name "debug-bro-bot"
          git config user.email "debug-bro-bot@users.noreply.github.com"
          [ -f "out/${{ steps.ep.outputs.slug }}/review.md" ] && cat "out/${{ steps.ep.outputs.slug }}/review.md"
          git add episodes
          git diff --cached --quiet || (git commit -m "review: ${{ steps.ep.outputs.slug }}" && git pull --rebase -q && git push)

      - name: Voice, render, approve, publish
        if: steps.plan.outputs.skip != 'yes'
        env:
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'sarvam' }}
          POST_MODE: ${{ vars.POST_MODE || 'manual' }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          PUBLIC_MEDIA_BASE: ${{ secrets.PUBLIC_MEDIA_BASE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
          TRENDING_AUDIO: ${{ vars.TRENDING_AUDIO || 'off' }}
          TRENDING_AUDIO_VOLUME: ${{ vars.TRENDING_AUDIO_VOLUME || '12' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_TIMEOUT_MIN: "30"
          APPROVAL_DEFAULT: ${{ vars.APPROVAL_DEFAULT || 'approve' }}
        run: |
          ARGS=""
          [ -n "${{ steps.ep.outputs.slug }}" ] && ARGS="--slug=${{ steps.ep.outputs.slug }}"
          if [ "${{ inputs.publish }}" != "true" ]; then
            ARGS="$ARGS --no-publish"
          fi
          node pipeline/run.mjs $ARGS

      - name: Keep the rendered files for 14 days
        if: always() && steps.plan.outputs.skip != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Save the publish log
        if: always() && steps.plan.outputs.skip != 'yes'
        run: |
          git config user.name "debug-bro-bot"
          git config user.email "debug-bro-bot@users.noreply.github.com"
          git add data/published.json episodes
          git diff --cached --quiet || (git commit -m "log: published" && git pull --rebase -q && git push)

  # DSA-101 only: compile and run the PDF's solutions (separate job, no secrets). A red job means: do not send the PDF.
  check-code:
    needs: reel
    if: startsWith(needs.reel.outputs.slug, 'dsa')
    permissions:
      contents: read
    uses: ./.github/workflows/check-code.yml
    with:
      slug: ${{ needs.reel.outputs.slug }}
