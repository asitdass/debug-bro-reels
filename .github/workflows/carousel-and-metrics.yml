name: Carousel + metrics

on:
  schedule:
    - cron: "0 2 * * *"     # 07:30 IST daily: pull Insights
    - cron: "30 6 * * 3,6"  # 12:00 IST Wed + Sat: carousel cheat-sheet of the latest reel
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PUBLIC_MEDIA_BASE: ${{ secrets.PUBLIC_MEDIA_BASE }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Metrics
        if: github.event.schedule != '30 6 * * 3,6'
        run: node pipeline/metrics.mjs

      - name: Carousel
        if: github.event.schedule == '30 6 * * 3,6' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          SLUG=$(node -e "const p=require('./data/published.json').filter(x=>x.kind==='reel');console.log(p.at(-1)?.slug||'')")
          [ -z "$SLUG" ] && { echo "nothing published yet"; exit 0; }
          # slides need the episode's timings; regenerate them silently if the voice files aren't in the repo
          [ -f "episodes/$SLUG/timings.json" ] || { pip install -q edge-tts && python3 pipeline/tts.py "$SLUG"; }
          node -e "import('./pipeline/render.mjs').then(async m=>{const {timings,episode}=m.loadProps('$SLUG');const keep=['hook','code','hotrow','solution','flow','compare','rule','counter','chat'];const f=m.keyFrames(timings).filter((_,i)=>keep.includes(episode.scenes[i].type)).slice(0,8);await m.renderStills('$SLUG',f,{hideCaptions:true,prefix:'slide'})})"
          if [ -z "$S3_ENDPOINT" ]; then
            # no bucket: publish the slides on the "media" branch so Instagram can fetch them from raw.githubusercontent.com
            mkdir -p /tmp/slides && cp out/$SLUG/slide-*.jpg /tmp/slides/
            git config user.name "debug-bro-bot"
            git config user.email "debug-bro-bot@users.noreply.github.com"
            git stash -u -q || true
            git fetch -q origin media || true
            if git rev-parse --verify -q origin/media >/dev/null; then git checkout -q -B media origin/media; else git checkout -q --orphan media && git rm -rfq .; fi
            mkdir -p "$SLUG" && cp /tmp/slides/* "$SLUG/" && git add "$SLUG"
            git diff --cached --quiet || git commit -qm "media: $SLUG slides"
            git push -q origin media
            git checkout -q main && git stash pop -q || true
            sleep 20
          fi
          node pipeline/run.mjs --only=carousel --slug="$SLUG"

      - name: Save
        if: always()
        run: |
          git config user.name "debug-bro-bot"
          git config user.email "debug-bro-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: metrics/carousel" && git push)
