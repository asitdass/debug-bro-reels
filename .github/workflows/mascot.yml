name: Draw the mascot

# Run by hand. The bot asks for your photos on Telegram, draws the cartoon on a Modal GPU, and asks you to approve.
on:
  workflow_dispatch:
    inputs:
      poses_only:
        description: "Keep the current cartoon (public/mascot/master.png) and only redraw the poses"
        type: boolean
        default: false

concurrency: mascot

jobs:
  mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "modal>=1.6,<2" "rembg[cpu]>=2.0.60" pillow
      - name: Draw
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDIT_MODEL: ${{ vars.EDIT_MODEL || 'black-forest-labs/FLUX.2-klein-4B' }}
          MODAL_GPU: ${{ vars.MODAL_GPU || 'L4' }}
        run: python pipeline/mascot.py ${{ inputs.poses_only && '--poses-only' || '' }}
      - name: Keep the drafts for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-${{ github.run_number }}
          path: out/mascot/
          retention-days: 7
      - name: Save the mascot
        run: |
          git config user.name "debug-bro-bot"
          git config user.email "debug-bro-bot@users.noreply.github.com"
          git add public/mascot
          git diff --cached --quiet || (git commit -m "mascot: new pose set" && git pull --rebase -q && git push)
